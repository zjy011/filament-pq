[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filament-pq"
version = "0.1.0"
description = "Classical solar filament instance segmentation with annotator-aware PQ"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-python-headless>=4.9,<6",
  "scikit-image>=0.23,<0.27", "PyYAML>=6,<7", "pycocotools>=2.0.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
# The unified torch.amp.GradScaler API is available from PyTorch 2.3.
unet = ["torch>=2.3,<3", "torchvision>=0.18,<1", "segmentation-models-pytorch>=0.4,<1"]
report = ["matplotlib>=3.8,<4", "reportlab>=4,<5", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
include = ["filament*", "scripts*"]

[tool.setuptools.package-data]
"filament.unet" = ["LICENSE.clDice.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
